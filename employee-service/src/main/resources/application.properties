# server.port=8081
spring.application.name=employee-service
spring.config.import=configserver:http://localhost:8888

# RABBIT MQ CONFIGURATION
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
#management.endpoints.web.exposure.include=bus-refresh
logging.level.org.springframework.cloud.bus=DEBUG
logging.level.org.springframework.amqp=DEBUG

management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:}, %X{traceId:-}, %X{spanId:-}]
logging.level.org.springframework.web=DEBUG

spring.zipkin.base.url=http://127.0.0.1:9411/

# USING CIRCUIT BREAKER
# actuator endpoint for circuit breaker
management.health.circuitbreakers.enabled=true
# using * instead of health will include all the endpoints
management.endpoints.web.exposure.include=health
management.endpoints.health.show-details=always



# CIRCUIT BREAKER CONFIGURATION
resilience4j.circuitbreaker.instances.employee-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.employee-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.employee-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.employee-service.automaticTransitionToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.employee-service.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.employee-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.employee-service.slidingWindowSize=10
# THERE ARE 2 TYPES = [ COUNT_BASED, TIME_BASED ]
resilience4j.circuitbreaker.instances.employee-service.slidingWindowType=COUNT_BASED

# RETRY CONFIGURATION
resilience4j.retry.instances.employee-service.registerHealthIndicator=true
# default is 3
resilience4j.retry.instances.employee-service.maxRetryAttempts=5
resilience4j.retry.instances.employee-service.waitDuration=1s